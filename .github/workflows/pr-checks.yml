name: PR checks

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    name: Build & type-check (all apps)
    runs-on: ubuntu-latest

    # The agent platform's API tests run against a real Postgres: its SQL only
    # fails on a live server (a bad column alias 500ed /api/usage in v0.10.0),
    # so an unreachable database proves nothing about those routes.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sleekdrops
          POSTGRES_PASSWORD: sleekdrops
          POSTGRES_DB: sleekdrops_agent
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U sleekdrops -d sleekdrops_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check website
        run: pnpm --filter @sleekdrops/web check

      - name: Build website
        env:
          SITE_URL: https://sleekdrops.com
          # PR builds fetch live editorial content from D1 so astro check
          # sees real posts (same read-only credentials as deploys).
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: b98d83ac-a2a5-42cb-a367-0cb71b902670
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @sleekdrops/web build

      - name: Test website
        run: pnpm --filter @sleekdrops/web test

      - name: Type-check agent platform
        run: pnpm --filter @sleekdrops/agent check

      - name: Test agent platform
        env:
          DATABASE_URL: postgres://sleekdrops:sleekdrops@localhost:5544/sleekdrops_agent
        run: pnpm --filter @sleekdrops/agent test

      - name: Build admin panel
        run: pnpm --filter @sleekdrops/admin build

      - name: Test admin panel
        run: pnpm --filter @sleekdrops/admin test
