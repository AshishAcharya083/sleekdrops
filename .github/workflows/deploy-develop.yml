name: Deploy to develop

on:
  push:
    branches: [develop]
  workflow_dispatch:

# Cancel older develop deploys when a newer commit lands.
concurrency:
  group: deploy-develop
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    name: Build & deploy (develop)
    runs-on: ubuntu-latest
    environment:
      name: develop
      url: https://develop.sleekdrops.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Build (develop)
        env:
          SITE_URL: https://develop.sleekdrops.com
          NODE_ENV: production
        run: pnpm build

      - name: Deploy to Cloudflare Pages (develop)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=develop
