name: Deploy to develop

on:
  push:
    branches: [develop]
    # Only the website deploys to Cloudflare Pages — agent-platform-only
    # commits (apps/agent, apps/admin) don't need a site rebuild.
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-develop.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

# Cancel older develop deploys when a newer commit lands.
concurrency:
  group: deploy-develop
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    name: Build & deploy (develop)
    runs-on: ubuntu-latest
    environment:
      name: develop
      # The preview alias for this branch. Cloudflare Pages serves the project's
      # *production* branch at the bare `sleekdrops.pages.dev` and every other
      # branch at `<branch>.sleekdrops.pages.dev`, so the bare host named here
      # before pointed GitHub's Deployments UI - and anyone checking what a
      # develop deploy actually shipped - straight at production.
      url: https://develop.sleekdrops.pages.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check
        run: pnpm --filter @sleekdrops/web check

      - name: Build (develop)
        env:
          # Deliberately NOT this deploy's own preview host. SITE_URL is what
          # every canonical link, og:url and sitemap entry is built from, so
          # pointing it at the preview would make develop a self-canonicalising
          # second copy of the site competing with the real one in the index.
          # Aimed at the production host instead, every develop page tells a
          # crawler that the canonical version of it lives there.
          SITE_URL: https://sleekdrops.com
          # Marks this build a preview, which noindexes every page it renders and
          # publishes a robots.txt that advertises no sitemap.
          #
          # Develop is held at the same code level as main and renders the same
          # pages from the same live editorial content, so left indexable it is a
          # complete second copy of the site competing with the real one for its
          # own rankings - and, to an AdSense reviewer, duplicated content on a
          # domain the account does not own.
          #
          # Only the exact string `production` is indexable, so this line going
          # missing fails safe. The reverse - production's line going missing and
          # de-listing the live site - is caught by a test over both workflows
          # (apps/web/src/lib/site-env.test.ts) rather than by hoping.
          PUBLIC_SITE_ENV: preview
          NODE_ENV: production
          # Disabled on every public deployment until the processor publishes
          # verifiable privacy, jurisdiction and retention terms. GA4 remains
          # available behind the site's explicit analytics opt-in.
          PUBLIC_DEVTEAM_ANALYTICS_INGEST_KEY: ''
          PUBLIC_DEVTEAM_ANALYTICS_HOST: ''
          # In-app feedback widget - develop only. It is a visible control on the
          # page, so production stays without it until we have looked at it here.
          PUBLIC_DEVTEAM_ANALYTICS_FEEDBACK: 'true'
          # Google Analytics 4 - the measurement id of the property THIS
          # environment reports into, read from the matching GitHub Environment
          # (develop) so develop and production carry different values under one
          # name. Public: it ships in the JS bundle every visitor downloads, so
          # it is a repo/environment *variable* rather than a secret.
          #
          # Per environment for the reason the AdSense ids are: one property
          # receiving both sites means every figure production is judged on -
          # sessions, conversion rate, the affiliate click-through - is inflated
          # by preview traffic, and nothing in GA4 can separate the two after the
          # fact beyond a hostname filter nobody remembers to apply.
          #
          # An empty value (or anything that is not a `G-` measurement id)
          # disables GA4 silently after one console warning: gtag.js is never
          # requested and no `_ga` cookie is written. The rest of the site is
          # unaffected.
          PUBLIC_GA4_ID: ${{ vars.GA4_MEASUREMENT_ID }}
          # DevTeam A/B Testing - flag-delivery host + per-environment client key.
          # Held in repo settings for the same reason as the ingest key above: the
          # key is minted per environment in the A/B Testing tab and a stale one
          # serves an empty payload, so every experiment would read 0% while the
          # site looks healthy. An empty value disables experiments and every
          # feature falls back to its code-side default.
          PUBLIC_DEVTEAM_FLAGS_HOST: ${{ vars.DEVTEAM_FLAGS_HOST }}
          PUBLIC_DEVTEAM_FLAGS_CLIENT_KEY: ${{ secrets.DEVTEAM_FLAGS_CLIENT_KEY }}
          # Google AdSense - publisher id (ca-pub-...) + one slot id per placement.
          # All public: they ship in the ad markup every visitor downloads, so they
          # are repo *variables* rather than secrets. Held in repo settings for the
          # same reason as the keys above - they are minted per environment in the
          # AdSense console, and a value from the wrong environment reports its
          # revenue against the wrong property while the page looks healthy.
          #
          # An empty publisher id disables ads silently: no partner script, no
          # ads.txt, nothing to consent to.
          #
          # Develop is pinned EMPTY, and deliberately does not read
          # `vars.ADSENSE_CLIENT`. Read through a variable, this environment
          # inherits any repo-level or org-level `ADSENSE_CLIENT` that anyone
          # ever adds - and adding one is the natural mistake, because the
          # publisher id really is the same for the whole account, so scoping it
          # per environment looks redundant until you know why it is not.
          #
          # Why it is not: sleekdrops.pages.dev is a different domain from
          # sleekdrops.com and is not in the AdSense account's Sites list.
          # Publishing the publisher id there puts a /ads.txt and a
          # google-adsense-account tag on an unlisted domain claiming the
          # account, which is exactly the shape of a review failure - and
          # develop tracks main closely enough that the code is otherwise
          # identical, so this line is the entire difference between the two.
          #
          # An empty value disables ads, ads.txt and the verification tag
          # together, which is what a preview deploy should publish: nothing.
          # Turning ads on here means changing this line and knowing why.
          PUBLIC_ADSENSE_CLIENT: ''
          # Develop is a code-only preview rendered against the SAME live
          # editorial content as production. Content lives in Cloudflare D1,
          # so the build needs the same D1 env vars as prod.
          # Reused prod secrets on purpose — this is a test deploy target.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: b98d83ac-a2a5-42cb-a367-0cb71b902670
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          # Fallback while CLOUDFLARE_D1_TOKEN isn't set — works only if the
          # Pages deploy token also has D1 read permission.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @sleekdrops/web build

      - name: Deploy to Cloudflare Pages (develop)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Run from apps/web so wrangler picks up the functions/ directory.
          workingDirectory: apps/web
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=develop

      # Clear the edge copy of whatever this deploy changed. Pages invalidates
      # its own asset cache on deploy, but a *redirect* the zone cached is a
      # different object: when the site flipped its canonical URL form, edge
      # nodes went on serving the previous permanent 308 to the old form, which
      # is half of the loop that produced ERR_TOO_MANY_REDIRECTS
      # (functions/_lib/canonical.mjs). Purging here is what stops a URL-form
      # change leaving a stale redirect behind again; the middleware is what
      # protects a visitor whose own browser cached one.
      #
      # Deliberately not continue-on-error: a purge that silently failed leaves
      # exactly the state this step exists to prevent, so the deploy goes red
      # and someone purges by hand.
      - name: Purge the Cloudflare edge cache
        env:
          # Zone → Overview → Zone ID, for the zone serving the develop host.
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          # Needs "Zone → Cache Purge → Purge" on top of the Pages scopes.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "::warning::CLOUDFLARE_ZONE_ID is unset - skipping the edge cache purge. Expected while develop is served from the bare *.pages.dev host, which is not a zone this account can purge; set it once develop.sleekdrops.com is bound."
            exit 0
          fi
          status=$(curl -sS -o /tmp/purge.json -w '%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"purge_everything":true}')
          cat /tmp/purge.json 2>/dev/null
          echo
          if [ "$status" != "200" ]; then
            echo "::error::Cache purge failed (HTTP $status). Purge the zone by hand before trusting this deploy."
            exit 1
          fi
          echo "Edge cache purged."
