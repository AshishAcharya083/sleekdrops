name: Deploy to develop

on:
  push:
    branches: [develop]
  workflow_dispatch:

# Cancel older develop deploys when a newer commit lands.
concurrency:
  group: deploy-develop
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    name: Build & deploy (develop)
    runs-on: ubuntu-latest
    environment:
      name: develop
      url: https://sleekdrops.pages.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Build (develop)
        env:
          SITE_URL: https://sleekdrops.pages.dev
          NODE_ENV: production
          # DevTeam Analytics — public ingest key (dtp_) + prod ingest host.
          # The key is ingest-only and safe to commit; PUBLIC_ exposes it to
          # the Astro build so the DevTeam analytics + logging sink is active.
          PUBLIC_Devteam__IngestKey: dtp_DRw4qtfSLhfa1jPCO1Q_edy_hW2-c95rProH99ApjA4
          PUBLIC_Devteam__Host: https://ingest.getdevteam.ai
          # Develop is a code-only preview rendered against the SAME live
          # editorial content as production. Content now lives in Cloudflare
          # 2026-06-13), so the build needs the same D1 env vars as prod.
          # Reused prod secrets on purpose — this is a test deploy target.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: b98d83ac-a2a5-42cb-a367-0cb71b902670
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          # Fallback while CLOUDFLARE_D1_TOKEN isn't set — works only if the
          # Pages deploy token also has D1 read permission.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm build

      - name: Deploy to Cloudflare Pages (develop)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=develop
