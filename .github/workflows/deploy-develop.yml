name: Deploy to develop

on:
  push:
    branches: [develop]
    # Only the website deploys to Cloudflare Pages — agent-platform-only
    # commits (apps/agent, apps/admin) don't need a site rebuild.
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-develop.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

# Cancel older develop deploys when a newer commit lands.
concurrency:
  group: deploy-develop
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    name: Build & deploy (develop)
    runs-on: ubuntu-latest
    environment:
      name: develop
      url: https://sleekdrops.pages.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check
        run: pnpm --filter @sleekdrops/web check

      - name: Build (develop)
        env:
          SITE_URL: https://sleekdrops.pages.dev
          NODE_ENV: production
          # DevTeam Analytics - public ingest key (dtp_) + ingest host. The key is
          # ingest-only and safe to expose; PUBLIC_ hands it to the Astro build so
          # the analytics + logging sink is active.
          #
          # Held in repo settings rather than inline: re-provisioning a project on
          # DevTeam mints a NEW analytics project and key, and the old key keeps
          # returning 202 from an orphaned project. A hardcoded key therefore goes
          # stale silently - the site looks healthy while the Analytics tab reads a
          # different project and shows nothing. The admin panel reads the same two
          # settings, so both apps always report into one project.
          PUBLIC_DEVTEAM_ANALYTICS_INGEST_KEY: ${{ secrets.DEVTEAM_ANALYTICS_INGEST_KEY }}
          PUBLIC_DEVTEAM_ANALYTICS_HOST: ${{ vars.DEVTEAM_ANALYTICS_HOST }}
          # In-app feedback widget - develop only. It is a visible control on the
          # page, so production stays without it until we have looked at it here.
          PUBLIC_DEVTEAM_ANALYTICS_FEEDBACK: 'true'
          # DevTeam A/B Testing - flag-delivery host + per-environment client key.
          # Held in repo settings for the same reason as the ingest key above: the
          # key is minted per environment in the A/B Testing tab and a stale one
          # serves an empty payload, so every experiment would read 0% while the
          # site looks healthy. An empty value disables experiments and every
          # feature falls back to its code-side default.
          PUBLIC_DEVTEAM_FLAGS_HOST: ${{ vars.DEVTEAM_FLAGS_HOST }}
          PUBLIC_DEVTEAM_FLAGS_CLIENT_KEY: ${{ secrets.DEVTEAM_FLAGS_CLIENT_KEY }}
          # Develop is a code-only preview rendered against the SAME live
          # editorial content as production. Content lives in Cloudflare D1,
          # so the build needs the same D1 env vars as prod.
          # Reused prod secrets on purpose — this is a test deploy target.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: b98d83ac-a2a5-42cb-a367-0cb71b902670
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          # Fallback while CLOUDFLARE_D1_TOKEN isn't set — works only if the
          # Pages deploy token also has D1 read permission.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @sleekdrops/web build

      - name: Deploy to Cloudflare Pages (develop)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Run from apps/web so wrangler picks up the functions/ directory.
          workingDirectory: apps/web
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=develop
