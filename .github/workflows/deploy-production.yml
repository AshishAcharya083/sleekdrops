name: Deploy to production

on:
  push:
    branches: [main]
  # Fired by sleekdrops-cms's notify-main.yml whenever editorial content
  # changes there (new post, updated affiliate-links.json). Triggers a full
  # rebuild against the latest content commit — no code change in this repo.
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

# Cancel any in-flight production deploy when a newer commit lands on main
# OR when a fresh content-updated dispatch arrives.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    name: Build & deploy (production)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sleekdrops.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Build (production)
        env:
          SITE_URL: https://sleekdrops.com
          NODE_ENV: production
          # Used by scripts/fetch-content.mjs to clone sleekdrops-cms during
          # the prebuild step. The PAT in CMS_CONTENT_PAT only needs
          # `contents: read` on sleekdrops-cms.
          CMS_REPO_URL: https://x-access-token:${{ secrets.CMS_CONTENT_PAT }}@github.com/AshishAcharya083/sleekdrops-cms.git
          CMS_REPO_REF: main
        run: pnpm build

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=main
