name: Deploy to production

on:
  push:
    branches: [main]
    # Only the website deploys to Cloudflare Pages — agent-platform-only
    # commits (apps/agent, apps/admin) don't need a site rebuild.
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-production.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  # Fired whenever editorial content changes in the D1 database (a post's
  # status flips to 'published', or affiliate_links rows change). Anything
  # with a GitHub token can trigger it:
  #   POST /repos/AshishAcharya083/sleekdrops/dispatches
  #   {"event_type": "content-updated"}
  # The apps/agent publisher calls this after its D1 writes.
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

# Cancel any in-flight production deploy when a newer commit lands on main
# OR when a fresh content-updated dispatch arrives.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    name: Build & deploy (production)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sleekdrops.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check
        run: pnpm --filter @sleekdrops/web check

      - name: Build (production)
        env:
          SITE_URL: https://sleekdrops.com
          # The one build that may be indexed. `production` is the only value
          # that means it: every other deployment - develop, a future preview, a
          # local `pnpm dev` - noindexes itself by default rather than by
          # remembering to.
          #
          # This line is therefore load-bearing for the whole site's search
          # presence. Removing it does not break the build, it silently
          # de-lists sleekdrops.com, so a test over both deploy workflows
          # (apps/web/src/lib/site-env.test.ts) fails CI if it goes missing.
          PUBLIC_SITE_ENV: production
          NODE_ENV: production
          # DevTeam Analytics - public ingest key (dtp_) + ingest host. The key is
          # ingest-only and safe to expose; PUBLIC_ hands it to the Astro build so
          # the analytics + logging sink is active.
          #
          # Held in repo settings rather than inline, matching deploy-develop.yml:
          # an inlined key is committed to git history for anyone with repo access,
          # and it goes stale silently when the project is re-provisioned on
          # DevTeam - the site looks healthy while the Analytics tab reads a
          # different project and shows nothing.
          PUBLIC_DEVTEAM_ANALYTICS_INGEST_KEY: ${{ secrets.DEVTEAM_ANALYTICS_INGEST_KEY }}
          PUBLIC_DEVTEAM_ANALYTICS_HOST: ${{ vars.DEVTEAM_ANALYTICS_HOST }}
          # Google Analytics 4 - the measurement id of the property THIS
          # environment reports into, read from the matching GitHub Environment
          # (production) so develop and production carry different values under one
          # name. Public: it ships in the JS bundle every visitor downloads, so
          # it is a repo/environment *variable* rather than a secret.
          #
          # Per environment for the reason the AdSense ids are: one property
          # receiving both sites means every figure production is judged on -
          # sessions, conversion rate, the affiliate click-through - is inflated
          # by preview traffic, and nothing in GA4 can separate the two after the
          # fact beyond a hostname filter nobody remembers to apply.
          #
          # An empty value (or anything that is not a `G-` measurement id)
          # disables GA4 silently after one console warning: gtag.js is never
          # requested and no `_ga` cookie is written. The DevTeam sink is
          # unaffected, and so is the rest of the site.
          PUBLIC_GA4_ID: ${{ vars.GA4_MEASUREMENT_ID }}
          # DevTeam A/B Testing - flag-delivery host + per-environment client key.
          # Held in repo settings rather than inline: the key is minted per
          # environment in the A/B Testing tab and a stale one serves an empty
          # payload, so every experiment would read 0% while the site looks
          # healthy. An empty value disables experiments and every feature falls
          # back to its code-side default.
          PUBLIC_DEVTEAM_FLAGS_HOST: ${{ vars.DEVTEAM_FLAGS_HOST }}
          PUBLIC_DEVTEAM_FLAGS_CLIENT_KEY: ${{ secrets.DEVTEAM_FLAGS_CLIENT_KEY }}
          # Google AdSense - publisher id (ca-pub-...) + one slot id per placement.
          # All public: they ship in the ad markup every visitor downloads, so they
          # are repo *variables* rather than secrets. Held in repo settings for the
          # same reason as the keys above - they are minted per environment in the
          # AdSense console, and a value from the wrong environment reports its
          # revenue against the wrong property while the page looks healthy.
          #
          # An empty publisher id disables ads silently: no partner script, no
          # ads.txt, nothing to consent to.
          PUBLIC_ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          PUBLIC_ADSENSE_SLOT_ARTICLE_MID: ${{ vars.ADSENSE_SLOT_ARTICLE_MID }}
          PUBLIC_ADSENSE_SLOT_ARTICLE_END: ${{ vars.ADSENSE_SLOT_ARTICLE_END }}
          PUBLIC_ADSENSE_SLOT_SIDEBAR: ${{ vars.ADSENSE_SLOT_SIDEBAR }}
          PUBLIC_ADSENSE_SLOT_FEED: ${{ vars.ADSENSE_SLOT_FEED }}
          # Used by apps/web/scripts/fetch-content.mjs to read posts +
          # affiliate links from Cloudflare D1 during the prebuild step. The
          # database id is not a secret; CLOUDFLARE_D1_TOKEN needs
          # "Account → D1 → Read".
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: b98d83ac-a2a5-42cb-a367-0cb71b902670
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          # Fallback while CLOUDFLARE_D1_TOKEN isn't set — works only if the
          # Pages deploy token also has D1 read permission.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @sleekdrops/web build

      # The build-time PUBLIC_ values above are inlined into the browser bundle
      # by Vite and never reach a Pages Function. functions/go/[slug].js counts
      # the outbound affiliate click - the site's primary conversion - and reads
      # its ingest key and host from context.env, which is the Pages *runtime*
      # environment. That environment is set here, from the same repo secret and
      # variable, so a re-provisioned analytics project rotates both halves at
      # once and neither is ever committed.
      #
      # `pages secret put` for both: wrangler has no command for a plain-text
      # Pages variable, and a secret reads back through context.env identically.
      # An empty value is skipped rather than uploaded - the Function disables
      # its sink silently on an empty key and still serves the 302.
      - name: Publish the analytics runtime config to Pages Functions (production)
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          PAGES_ENV: production
          DEVTEAM_ANALYTICS_INGEST_KEY: ${{ secrets.DEVTEAM_ANALYTICS_INGEST_KEY }}
          DEVTEAM_ANALYTICS_HOST: ${{ vars.DEVTEAM_ANALYTICS_HOST }}
        run: |
          set -euo pipefail
          put() {
            if [ -z "${2:-}" ]; then
              echo "::notice::$1 is empty - the /go Function's analytics sink stays off"
              return 0
            fi
            printf '%s' "$2" | pnpm exec wrangler pages secret put "$1" \
              --project-name "$PROJECT_NAME" --env "$PAGES_ENV"
          }
          put DEVTEAM_ANALYTICS_INGEST_KEY "$DEVTEAM_ANALYTICS_INGEST_KEY"
          put DEVTEAM_ANALYTICS_HOST "$DEVTEAM_ANALYTICS_HOST"

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Run from apps/web so wrangler picks up the functions/ directory.
          workingDirectory: apps/web
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=main
