name: Deploy to production

on:
  push:
    branches: [main]
  # Fired whenever editorial content changes in the D1 database (a post's
  # status flips to 'published', or affiliate_links rows change). Anything
  # with a GitHub token can trigger it:
  #   POST /repos/AshishAcharya083/sleekdrops/dispatches
  #   {"event_type": "content-updated"}
  # The future sleekdrops-agent publisher calls this after its D1 writes.
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

# Cancel any in-flight production deploy when a newer commit lands on main
# OR when a fresh content-updated dispatch arrives.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    name: Build & deploy (production)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sleekdrops.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Build (production)
        env:
          SITE_URL: https://sleekdrops.com
          NODE_ENV: production
          # Used by scripts/fetch-content.mjs to read posts + affiliate links
          # from Cloudflare D1 during the prebuild step. The database id is
          # not a secret; CLOUDFLARE_D1_TOKEN needs "Account → D1 → Read".
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: b98d83ac-a2a5-42cb-a367-0cb71b902670
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          # Fallback while CLOUDFLARE_D1_TOKEN isn't set — works only if the
          # Pages deploy token also has D1 read permission.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Google Analytics 4 Measurement ID (public — safe as a secret or
          # plain env var). Omit to disable analytics in this environment.
          PUBLIC_GA4_ID: ${{ secrets.PUBLIC_GA4_ID }}
        run: pnpm build

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=main
