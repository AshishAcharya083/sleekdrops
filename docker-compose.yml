# Local infrastructure for the SleekDrops agent platform (apps/agent): a
# throwaway Postgres for development. It holds what the SleekDrops Supabase
# project holds in production - pipeline state (topics, articles, agent
# sessions, usage) and the posts + affiliate_links tables a publish writes - so
# publishing against it never reaches the live site. ./up.sh starts it only when
# apps/agent/.env points DATABASE_URL here.
services:
  postgres:
    image: postgres:16-alpine
    container_name: sleekdrops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sleekdrops
      POSTGRES_PASSWORD: sleekdrops
      POSTGRES_DB: sleekdrops_agent
    ports:
      - '5544:5432'
    volumes:
      - sleekdrops-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sleekdrops -d sleekdrops_agent']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sleekdrops-pgdata:
