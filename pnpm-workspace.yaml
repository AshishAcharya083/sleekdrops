packages:
  - apps/*

# @getdevteam/analytics-web 0.3.0 imports `utf8ByteLength` from
# @getdevteam/analytics-core, which the published core 0.2.0 does not export - the
# symbol only exists in the platform repo's unreleased core. Without this override
# the build fails at rollup on that missing export. See vendor/README.md.
overrides:
  '@getdevteam/analytics-core': file:./vendor/getdevteam-analytics-core-unpublished.tgz

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
minimumReleaseAgeExclude:
  - astro@6.3.7
  - '@astrojs/cloudflare@13.5.4'
  - miniflare@4.20260520.0
  - wrangler@4.93.1
  - '@getdevteam/analytics-core@0.2.0'
  - '@getdevteam/analytics-web@0.2.0'
